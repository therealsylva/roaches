name: Roaches release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows:
      - "Roaches Android"
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Release version; must match app versionName"
        required: true
        default: "0.3.0"

permissions:
  contents: write

jobs:
  release:
    name: Sign and publish APK
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROACHES_KEYSTORE_BASE64: ${{ secrets.ROACHES_KEYSTORE_BASE64 }}
      ROACHES_STORE_PASSWORD: ${{ secrets.ROACHES_STORE_PASSWORD }}
      ROACHES_KEY_ALIAS: ${{ secrets.ROACHES_KEY_ALIAS }}
      ROACHES_KEY_PASSWORD: ${{ secrets.ROACHES_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release version
        run: |
          REQUESTED_VERSION="${{ inputs.version }}"
          if [ -z "$REQUESTED_VERSION" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            REQUESTED_VERSION="$GITHUB_REF_NAME"
          fi
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test -n "$APP_VERSION"
          if [ -n "$REQUESTED_VERSION" ]; then
            test "${REQUESTED_VERSION#v}" = "$APP_VERSION"
          fi
          echo "RELEASE_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.existing.outputs.exists != 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK
        if: steps.existing.outputs.exists != 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Require stable signing credentials
        if: steps.existing.outputs.exists != 'true'
        run: |
          test -n "$ROACHES_KEYSTORE_BASE64"
          test -n "$ROACHES_STORE_PASSWORD"
          test -n "$ROACHES_KEY_ALIAS"
          test -n "$ROACHES_KEY_PASSWORD"
          printf '%s' "$ROACHES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roaches-release.jks"

      - name: Audit and build signed release
        if: steps.existing.outputs.exists != 'true'
        run: |
          python3 scripts/anti_slop.py
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PROACHES_STORE_FILE="$RUNNER_TEMP/roaches-release.jks" \
            -PROACHES_STORE_PASSWORD="$ROACHES_STORE_PASSWORD" \
            -PROACHES_KEY_ALIAS="$ROACHES_KEY_ALIAS" \
            -PROACHES_KEY_PASSWORD="$ROACHES_KEY_PASSWORD" \
            --stacktrace

      - name: Verify and name APK
        if: steps.existing.outputs.exists != 'true'
        run: |
          VERSION="${RELEASE_VERSION#v}"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/roaches-release.apk "artifacts/Roaches-$VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "artifacts/Roaches-$VERSION.apk"
          sha256sum "artifacts/Roaches-$VERSION.apk" > "artifacts/Roaches-$VERSION.apk.sha256"

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_VERSION"
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          APK="artifacts/Roaches-${RELEASE_VERSION#v}.apk"
          CHECKSUM="$APK.sha256"
          gh release create "$TAG" "$APK" "$CHECKSUM" --generate-notes --title "Roaches ${TAG#v}"
